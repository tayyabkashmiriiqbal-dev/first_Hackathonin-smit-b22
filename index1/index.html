
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HCM Lite | HR Management System</title>
</head>

<body>

    <header>
        <h1>HCM Lite</h1>
        <p>Human Capital Management System</p>
    </header>

    <main>

        <!-- First-Time Company Setup -->
        <section>
            <h2>Company Setup</h2>
            <p>Set up your company and create the Admin account.</p>

            <form id="setup-form">

                <label for="company-name">Company Name:</label>
                <input
                    type="text"
                    id="company-name"
                    name="companyName"
                    placeholder="Enter company name"
                    required
                >

                <br><br>

                <label for="admin-name">Admin Name:</label>
                <input
                    type="text"
                    id="admin-name"
                    name="adminName"
                    placeholder="Enter admin name"
                    required
                >

                <br><br>

                <label for="setup-email">Admin Email:</label>
                <input
                    type="email"
                    id="setup-email"
                    name="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <br><br>

                <label for="setup-password">Admin Password:</label>
                <input
                    type="password"
                    id="setup-password"
                    name="adminPassword"
                    placeholder="Create password"
                    required
                >

                <br><br>

                <button type="submit">Create Company</button>

            </form>
        </section>

        <hr>

        <!-- Login Section -->
        <section>
            <h2>Login</h2>
            <p>Login to your account.</p>

            <form id="login-form">

                <label for="login-email">Email:</label>
                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <label for="login-password">Password:</label>
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <br><br>

                <button type="submit">Login</button>

            </form>
        </section>

        <hr>

        <!-- Change Password Section -->
        <section>
            <h2>Change Password</h2>

            <form id="change-password-form">

                <label for="old-password">Current Password:</label>
                <input
                    type="password"
                    id="old-password"
                    name="oldPassword"
                    required
                >

                <br><br>

                <label for="new-password">New Password:</label>
                <input
                    type="password"
                    id="new-password"
                    name="newPassword"
                    required
                >

                <br><br>

                <button type="submit">Change Password</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 HCM Lite. All rights reserved.</p>
    </footer>

</body>

</html>
